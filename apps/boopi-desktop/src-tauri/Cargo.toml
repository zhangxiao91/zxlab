[package]
name = "boopi-desktop"
version = "0.1.0"
description = "A quiet macOS desktop companion for zxlab"
authors = ["zxlab"]
edition = "2021"

[lib]
name = "boopi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
